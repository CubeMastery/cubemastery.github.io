<body class="map-body">
    <div id="globeViz"></div>


    <div class="map-top-block">
        <div id="tick-fill" class="map-progress-bar" style="width: 0%"></div>
        <h1 id="announcement" class="heading" style="opacity: 0%"></h1>
    </div>
    <div id="left-block" class="map-left-block">
    </div>
    <div id="right-block" class="map-right-block" style="opacity:0">
    </div>

    <script>
        const ARC_REL_LEN = 0.4; // relative to whole arc
        const FLIGHT_TIME = 1500;
        const NUM_RINGS = 5;
        const RINGS_MAX_R = 10; // deg
        const RING_PROPAGATION_SPEED = 10; // deg/sec
        const ROTATE_SPEED = 1;

        const globe = Globe()(document.getElementById("globeViz"));

        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = ROTATE_SPEED;

        let pageHidden = false;

        function pauseGlobeAnimations() {
            pageHidden = true;
            globe.controls().autoRotate = false;
            globe.controls().update();
            globe.arcsData([]);
            globe.ringsData([]);
        }
        function resumeGlobeAnimations() {
            pageHidden = false;
            globe.controls().autoRotate = false;
            globe.controls().update();
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    globe.controls().autoRotate = true;
                    globe.controls().update();
                });
            });
        }
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                pauseGlobeAnimations();
            } else {
                resumeGlobeAnimations();
            }
        });

        const camera = globe.camera();
        camera.position.y = 60;
        camera.lookAt(0, 0, 0);

        // Stop auto-rotation on drag
        last_dragged = 0;
        globe.controls().addEventListener('start', function () {
            // Check if mouse click was outside globe
            globe.controls().autoRotate = false;
            globe.controls().update();
            last_dragged = Date.now();
            setTimeout(() => {
                if (Date.now() - last_dragged > 15000) {
                    globe.controls().autoRotate = true;
                    globe.controls().update();
                }
            }, 20000);
        });

        var teams = [];
        var scores = [];
        var labels = [{
            name: "SLA",
            id: -1,
            lat: 90,
            lng: 0,
            color: "white",
            size: 20,
        }];
        color_index = 0;

        fetch("static/teams.json")
            .then((res) => res.json())
            .then((teamdata) => {
                for (var t of Object.values(teamdata)) {
                    teams.push(t);
                    scores.push({
                        name: t.name,
                        lng: t.location.lat,
                        lat: t.location.lng,
                        score: t.score,
                        color: t.color,
                    });
                    labels.push({
                        name: t.name,
                        lat: t.location.lat,
                        lng: t.location.lng,
                        color: t.color,
                        size: 30,
                        id: t.id,
                    });
                }
                console.log(labels);

                globe
                    .globeImageUrl("/static/img/earth-night.jpg")
                    //.backgroundImageUrl("/static/img/glitch-night-sky-3.png")
                    //.backgroundImageUrl("/static/img/merged.svg")
                    .backgroundImageUrl("/static/img/output.svg")
                    .htmlElementsData(labels)
                    .htmlElement(d => {
                        const el = document.createElement('div');
                        el.innerHTML = `
                            <div style="position:relative; overflow: visible; height:0">
                                <div style="position:absolute; bottom: 0; height: 50px; width: 30px">
                                    <b style="white-space: nowrap">${d.name}</b></br>
                                    <svg height="30px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116.8 122.88">
                                        <path fill="${d.color}" class="cls-1" d="M18,81.08l-5.78-56.9A4.3,4.3,0,0,1,14.39,20C41.59,2.6,54.66,9.66,66.7,16.16,76.22,21.3,84.92,26,103.75,10a4.45,4.45,0,0,1,6.2.44,4.22,4.22,0,0,1,1,2.42l5.78,56.89a4.23,4.23,0,0,1-1.38,3.57c-21.79,19.84-35,13.16-48.6,6.27C55.74,74,44.35,68.25,25.21,84.12a4.47,4.47,0,0,1-6.21-.5,4.26,4.26,0,0,1-1-2.54Z"/>
                                        <path fill="#1a1a1a" class="cls-2" d="M17.89,16.71l9.88,98.6a6.89,6.89,0,1,1-13.71,1.35L4.21,18.38a10.15,10.15,0,1,1,13.68-1.67Z"/>
                                    </svg>
                                </div>
                            </div>`;

                        el.style.color = d.color;
                        el.style.fontSize = "14px";
                        el.style.fontFamily = "sans-serif"

                        el.style['pointer-events'] = 'auto';
                        el.style.cursor = 'pointer';
                        if (d.id != -1) {
                            el.onclick = () => showTeam(d.id);
                        }
                        return el;
                    })
                    .arcColor((d) => d.color)
                    .onGlobeRightClick(updateLocation)
                    .arcDashLength(ARC_REL_LEN)
                    .arcDashGap(3)
                    .arcStroke(0.3)
                    .arcDashInitialGap(1)
                    .arcDashAnimateTime(FLIGHT_TIME)
                    .arcsTransitionDuration(0)
                    .ringColor(() => (t) => {
                        const c = window._currentRingColor || [255, 100, 50];
                        return `rgba(${c[0]},${c[1]},${c[2]},${1.2 - t})`;
                    })
                    .ringMaxRadius(RINGS_MAX_R)
                    .ringPropagationSpeed(RING_PROPAGATION_SPEED)
                    .ringRepeatPeriod((FLIGHT_TIME * ARC_REL_LEN) / NUM_RINGS)
                    .enablePointerInteraction(true);

            });

        let prevCoords = {lat: 0, lng: 0};

        function emitArc(endCoords) {
            setTimeout(() => {
                prevCoords = {lat: endCoords.lat, lng: endCoords.lng};
            }, FLIGHT_TIME);

            drawArc(prevCoords, endCoords);
        }

        function updateLocation(coords) {
            // Check if current domain is glitch.ad
            if (window.location.hostname !== "glitch.ad") {
                return;
            }
            // Show popup confirming location change
            if (!confirm("Update team location to lat: " + coords.lat + ", lng: " + coords.lng + "?")) {
                return;
            }
            fetch(window.location.origin + "/api/team/location", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    lat: coords.lat,
                    lng: coords.lng,
                }),
            }).then((res) => location.reload());
        }

        function drawArc(
            {lat: startLat, lng: startLng},
            {lat: endLat, lng: endLng},
            arcColor,
            ringColor,
        ) {
            window._currentRingColor = ringColor || [255, 100, 50];
            // add and remove arc after 1 cycle
            endLat += 2 * (0.5 - Math.random());
            endLng += 2 * (0.5 - Math.random());
            const arc = {startLat, startLng, endLat, endLng, color: arcColor};
            globe.arcsData([...globe.arcsData(), arc]);
            setTimeout(
                () => globe.arcsData(globe.arcsData().filter((d) => d !== arc)),
                FLIGHT_TIME * 2,
            );

            // add and remove target rings
            setTimeout(() => {
                const targetRing = {lat: endLat, lng: endLng};
                globe.ringsData([...globe.ringsData(), targetRing]);
                setTimeout(
                    () =>
                        globe.ringsData(globe.ringsData().filter((r) => r !== targetRing)),
                    FLIGHT_TIME * ARC_REL_LEN,
                );
            }, FLIGHT_TIME);
        }

        function drawRandomAttack() {
            attacker = teams[Math.floor(Math.random() * teams.length)];
            victim = teams[Math.floor(Math.random() * teams.length)];
            colors = ["darkRed", "darkBlue", "darkOrange", "darkGreen"];
            color = colors[Math.floor(Math.random() * colors.length)];
            drawArc(
                {lat: attacker.center[1], lng: attacker.center[0]},
                {lat: victim.center[1], lng: victim.center[0]},
                color,
                [255, 100, 50],
            );
        }

        /*setInterval(function () {
            setTimeout(function () {
                //drawArc({ lat: 0, lng: 0 }, { lat: 100, lng: 100 });
                drawRandomAttack();
            }, 3000 * Math.random());
        }, 100);
        */


    </script>

    <script>
        current_time = new Date().getTime();
        tick_len = 120 * 1000;
        tick_end = Math.ceil(current_time / tick_len) * tick_len;
        time_to_end = tick_end - current_time;
        setInterval(function () {
            current_time = new Date().getTime();
            percent_through_tick = ((1 - Math.min(((tick_end + 1000) - current_time) / tick_len, 1)) * 100) % 100;
            document.getElementById("tick-fill").style.width = (percent_through_tick) + "%";
        }, 1000);
        current_time = new Date().getTime();
        percent_through_tick = ((1 - Math.min(((tick_end + 1000) - current_time) / tick_len, 1)) * 100) % 100;
        document.getElementById("tick-fill").style.width = (percent_through_tick) + "%";
    </script>

    <script>
        function pollAnnouncements() {
            fetch("static/announcements.json")
                .then((res) => res.json())
                .then((data) => {
                    if (data["announcement"] != "") {
                        document.getElementById("announcement").innerHTML = data["announcement"];
                        document.getElementById("announcement").style.opacity = 1;
                    } else {
                        document.getElementById("announcement").style.opacity = 0;
                    }
                });
        }
        pollAnnouncements();
        setInterval(pollAnnouncements, 10000);
    </script>

    <script>
        function pollTeams() {
            fetch("static/teams.json")
                .then((res) => res.json())
                .then((teamdata) => {
                    for (var t of Object.values(teamdata)) {
                        if (teams.find((x) => x.name == t.name) == undefined) {
                            teams.push(t);
                            scores.push({
                                name: t.name,
                                lng: t.location.lat,
                                lat: t.location.lng,
                                score: t.score,
                                color: t.color,
                            });
                            labels.push({
                                name: t.name,
                                lat: t.location.lat,
                                lng: t.location.lng,
                                color: t.color,
                                size: 30,
                            });
                        }
                    }
                    globe.htmlElementsData(labels);
                });
        }
        pollTeams();
        setInterval(pollTeams, 60000);
    </script>

    <script>
        function pollScores() {
            fetch("static/scores.html")
                .then((res) => res.text())
                .then((data) => {
                    document.getElementById("left-block").innerHTML = data;
                });
        }
        pollScores();
        setInterval(pollScores, 30000);
    </script>

    <script>
        function gotoTeam(lat, lng, id) {
            globe.controls().autoRotate = false;
            globe.pointOfView({lat, lng}, 1000);
            showTeam(id);
            setTimeout(() => {
                globe.controls().autoRotate = true;
            }, 20000);
        }
    </script>

    <script>
        function showTeam(id) {
            // Load the team page into the right block
            fetch("/static/map/team_" + id + ".html")
                .then((res) => res.text())
                .then((data) => {
                    document.getElementById("right-block").innerHTML = data;
                    document.getElementById("right-block").style.opacity = 1;
                });

            // Hide the right block after 10 seconds
            setTimeout(() => {
                if (Date.now() - last_dragged > 15000) {
                    globe.controls().autoRotate = true;
                    globe.controls().update();
                }
            }, 20000);

        }
    </script>
